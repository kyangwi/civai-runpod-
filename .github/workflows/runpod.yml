name: Build and deploy CivIA Runpod worker

on:
  push:
    branches: [main, master]
    paths:
      - "runpod_deployment/**"
      - ".github/workflows/runpod.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Update the existing CivIA Runpod endpoint after publishing
        type: boolean
        default: false

concurrency:
  group: civia-runpod-container
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the CUDA base image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Set image name and tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-runpod"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish the worker
        uses: docker/build-push-action@v6
        with:
          context: ./runpod_deployment
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
      - name: Show deployment image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: printf 'Runpod image `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Update Runpod endpoint
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          RUNPOD_ENDPOINT_ID: ${{ vars.RUNPOD_ENDPOINT_ID }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_DEPLOY_API_KEY }}
        shell: bash
        run: |
          : "${RUNPOD_ENDPOINT_ID:?Set the RUNPOD_ENDPOINT_ID repository variable}"
          : "${RUNPOD_API_KEY:?Set the RUNPOD_DEPLOY_API_KEY repository secret}"
          jq -nc --arg image "$IMAGE" '{image: $image}' |
            curl --fail --silent --show-error --max-time 60 --output /dev/null \
              --request PATCH "https://api.runpod.io/v2/serverless/$RUNPOD_ENDPOINT_ID" \
              --header "Authorization: Bearer $RUNPOD_API_KEY" \
              --header 'Content-Type: application/json' \
              --data-binary @-
